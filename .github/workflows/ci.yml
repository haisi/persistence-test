name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Report coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: >-
            hibernate-support/target/site/jacoco/jacoco.xml
            persistence-test-core/target/site/jacoco/jacoco.xml
            plan-assertions/target/site/jacoco/jacoco.xml
            query-analysis/target/site/jacoco/jacoco.xml
            query-assertions/target/site/jacoco/jacoco.xml
            query-capture/target/site/jacoco/jacoco.xml
            snapshot-testing/target/site/jacoco/jacoco.xml
            spring-boot-autoconfigure/target/site/jacoco/jacoco.xml
          format: jacoco
