name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The entity/repository shape, the query executed, and the assertThatQueries()/PlanAssertions
        call that misbehaved.
      render: java
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module
      description: Which module the bug is in (e.g. query-assertions, hibernate-support, plan-assertions).
      placeholder: "query-assertions"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: persistence-test version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "25"
    validations:
      required: true
